<script type="module">
import { auth, db } from "./firebase.js";

import {
 onAuthStateChanged,
 signOut
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
 collection,
 query,
 where,
 doc,
 getDoc,
 getDocs,
 addDoc,
 updateDoc,
 deleteDoc,
 writeBatch,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const $ = id => document.getElementById(id);

let currentUser = null;
let editingId = null;
let allQuestions = [];
const AI_WORKER_URL = "https://nmms-ai-backend.jarinarajpura1979.workers.dev/";
let aiDrafts = [];
let aiSourceImages = [];

function message(text, error=false){
 $("status").textContent = text;
 $("status").style.background = error ? "#fee2e2" : "#eff6ff";
 $("status").style.color = error ? "#991b1b" : "#1e40af";
}

function safeText(value){
 return String(value ?? "").replace(/[&<>"']/g, ch => ({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[ch]));
}

function setAiStatus(text, error=false){
  $("aiStatus").textContent = text;
  $("aiStatus").style.color = error ? "#991b1b" : "#1e40af";
}

function selectedAiFiles(){
  const a = Array.from($("aiImages").files || []);
  const b = Array.from($("aiCamera").files || []);
  return [...a, ...b];
}

function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ""));
    reader.onerror = () => reject(new Error("ફોટો વાંચી શકાયો નથી."));
    reader.readAsDataURL(file);
  });
}

async function generateAiQuestions(){
  const files = selectedAiFiles();
  if(files.length < 1 || files.length > 3){
    setAiStatus("એક સાથે 1 થી 3 ફોટા પસંદ કરો.",true); return;
  }
  if(!$("aiChapter").value.trim()){
    setAiStatus("પ્રકરણનું નામ લખો.",true); return;
  }
  const allowed = ["image/jpeg","image/png","image/webp"];
  for(const f of files){
    if(!allowed.includes(f.type)){setAiStatus("માત્ર JPG, PNG અથવા WEBP ફોટા અપલોડ કરો.",true);return;}
    if(f.size > 5*1024*1024){setAiStatus("દરેક ફોટો 5 MB કરતાં નાનો હોવો જોઈએ.",true);return;}
  }
  const btn = $("generateAiBtn");
  btn.disabled = true;
  aiDrafts = [];
  $("aiReviewList").innerHTML = "";
  $("aiApproveActions").style.display = "none";
  try{
    setAiStatus("ફોટા તૈયાર થઈ રહ્યા છે...");
    const images = await Promise.all(files.map(async file => ({data: await fileToDataUrl(file)})));
    aiSourceImages = images.map(x => x.data);
    const token = await currentUser.getIdToken(true);
    setAiStatus("AI પ્રશ્નો વાંચી રહ્યું છે. થોડો સમય રાહ જુઓ...");
    const response = await fetch(AI_WORKER_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
      body:JSON.stringify({images})
    });
    const result = await response.json().catch(()=>({}));
    if(!response.ok || result.success !== true){
      const detail = result.details ? ` Groq: ${result.details.groq || "-"}; Gemini: ${result.details.gemini || "-"}` : "";
      throw new Error((result.error || `Server error ${response.status}`) + detail);
    }
    aiDrafts = (result.questions || []).map((q,i)=>({
      id:`ai-${i}-${Date.now()}`,
      q:q.question || q.q || "",
      o:Array.isArray(q.options)?q.options:(Array.isArray(q.o)?q.o:["","","",""]),
      a:q.correctAnswer || q.a || "",
      has_diagram:q.hasDiagram===true || q.has_diagram===true,
      box:q.diagramBox || q.box || null,
      questionBox:q.questionBox || null,
      photoIndex:Number.isInteger(q.photoIndex)?q.photoIndex:0,
      shortTrick:q.shortTrick || "",
      solutionSteps:q.solutionSteps || "",
      confidence:Number.isFinite(Number(q.confidence))?Math.max(0,Math.min(100,Number(q.confidence))):0,
      autoApproved:q.autoApproved===true,
      needsReview:q.needsReview===true,
      reviewReason:q.reviewReason || "",
      cropDataUrl:null,
      selected:q.autoApproved===true
    }));
    if(!aiDrafts.length) throw new Error("AI તરફથી કોઈ પ્રશ્ન મળ્યો નથી.");
    setAiStatus("AI પ્રશ્નોના અલગ Crop તૈયાર કરી રહ્યું છે...");
    await Promise.all(aiDrafts.map(async q => { q.cropDataUrl = await cropQuestionFromSource(q); }));
    renderAiDrafts();
    const autoCount = aiDrafts.filter(q=>q.autoApproved).length;
    const reviewCount = aiDrafts.length - autoCount;
    setAiStatus(`${aiDrafts.length} પ્રશ્નો મળ્યા. ${autoCount} પ્રશ્નો AIના નિયમો મુજબ Auto-Approve માટે પસંદ છે અને ${reviewCount} પ્રશ્નો શિક્ષકની ચકાસણી માટે છે. Auto-Approve પણ અંતિમ સત્યની ખાતરી નથી; નમૂનાની ચકાસણી કરો.`);
  }catch(error){
    setAiStatus("AI પ્રક્રિયામાં ભૂલ: "+error.message,true);
  }finally{btn.disabled=false;}
}

async function cropQuestionFromSource(q){
  if(!q.questionBox || !aiSourceImages[q.photoIndex]) return null;
  const img = new Image();
  const loaded = new Promise((resolve,reject)=>{
    img.onload = resolve;
    img.onerror = () => reject(new Error("મૂળ ફોટો Crop માટે વાંચી શકાયો નથી."));
  });
  img.src = aiSourceImages[q.photoIndex];
  await loaded;
  const [y1,x1,y2,x2] = q.questionBox;
  const sx = Math.max(0, Math.floor(img.naturalWidth * x1 / 1000));
  const sy = Math.max(0, Math.floor(img.naturalHeight * y1 / 1000));
  const ex = Math.min(img.naturalWidth, Math.ceil(img.naturalWidth * x2 / 1000));
  const ey = Math.min(img.naturalHeight, Math.ceil(img.naturalHeight * y2 / 1000));
  const w = ex-sx, h = ey-sy;
  if(w<20 || h<20) return null;
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d",{alpha:false});
  ctx.drawImage(img, sx, sy, w, h, 0, 0, w, h);
  return canvas.toDataURL("image/jpeg", 0.92);
}

function renderAiDrafts(){
  const host = $("aiReviewList"); host.innerHTML = "";
  aiDrafts.forEach((q,index)=>{
    const card = document.createElement("section"); card.className="ai-card";
    const title = document.createElement("h4");
    title.textContent = `પ્રશ્ન ${index+1} | ફોટો ${q.photoIndex+1}`;
    card.appendChild(title);

    if(q.cropDataUrl){
      const cropTitle = document.createElement("div");
      cropTitle.className = "ai-note";
      cropTitle.textContent = "AI Auto-Crop: પ્રશ્ન અને ચારેય વિકલ્પો";
      card.appendChild(cropTitle);
      const cropImg = document.createElement("img");
      cropImg.src = q.cropDataUrl;
      cropImg.alt = `પ્રશ્ન ${index+1} Crop`;
      cropImg.style.cssText = "display:block;max-width:100%;max-height:360px;border:1px solid #94a3b8;border-radius:8px;background:white;margin:8px 0;";
      card.appendChild(cropImg);
      const dl = document.createElement("a");
      dl.href = q.cropDataUrl;
      dl.download = `NMMS-question-${index+1}-crop.jpg`;
      dl.textContent = "Crop કરેલો પ્રશ્ન ડાઉનલોડ કરો";
      dl.style.cssText = "display:inline-block;margin:4px 0 10px;color:#1d4ed8;font-weight:bold;";
      card.appendChild(dl);
    } else {
      const cropWarn = document.createElement("div");
      cropWarn.className = "ai-note";
      cropWarn.textContent = "આ પ્રશ્નનું Auto-Crop સ્થાન AI પાસેથી મળ્યું નથી. આ પ્રશ્નને મૂળ ફોટા સાથે ચકાસો.";
      card.appendChild(cropWarn);
    }

    const meta = document.createElement("div"); meta.className = "ai-meta";
    const score = document.createElement("span");
    score.textContent = `AI વિશ્વાસ સ્કોર: ${q.confidence}%`;
    meta.appendChild(score);
    const status = document.createElement("span");
    status.textContent = q.autoApproved ? "Auto-Approve માટે યોગ્ય" : "શિક્ષકની ચકાસણી જરૂરી";
    if(q.autoApproved) status.className = "ai-good";
    meta.appendChild(status);
    card.appendChild(meta);

    if(q.needsReview || !q.autoApproved){
      const review = document.createElement("div");
      review.className = "ai-note";
      review.textContent = "ચકાસણી જરૂરી: " + (q.reviewReason || "આ પ્રશ્ન Auto-Approve ની બધી શરતો પૂર્ણ કરતો નથી. જવાબ અને લખાણ તપાસો.");
      card.appendChild(review);
    }

    const checkLabel = document.createElement("label");
    const check = document.createElement("input");
    check.type = "checkbox";
    check.checked = q.selected;
    check.addEventListener("change", () => { q.selected = check.checked; });
    checkLabel.append(check, document.createTextNode(q.autoApproved ? " Auto-Approve થયેલો પ્રશ્ન સેવ કરો" : " ચકાસ્યા પછી આ પ્રશ્ન સેવ કરવા પસંદ કરો"));
    card.appendChild(checkLabel);

    if(q.has_diagram){
      const note = document.createElement("div");
      note.className = "ai-note";
      note.textContent = q.box
        ? `આકૃતિ મળી. અંદાજિત Crop Box: ${q.box.join(", ")} (મૂળ ફોટામાં ચકાસો).`
        : "આકૃતિ મળી; તેનું સ્થાન ચકાસવું જરૂરી છે.";
      card.appendChild(note);
    }

    const qLabel = document.createElement("label"); qLabel.textContent = "પ્રશ્ન"; card.appendChild(qLabel);
    const qInput = document.createElement("textarea"); qInput.value = q.q;
    qInput.addEventListener("input", () => q.q = qInput.value); card.appendChild(qInput);

    q.o.forEach((value, j) => {
      const label = document.createElement("label");
      label.textContent = `વિકલ્પ ${"ABCD"[j]}`;
      card.appendChild(label);
      const input = document.createElement("input");
      input.value = value;
      input.addEventListener("input", () => q.o[j] = input.value);
      card.appendChild(input);
    });

    const answerLabel = document.createElement("label");
    answerLabel.textContent = "સાચો જવાબ (શિક્ષકે ચકાસવો જરૂરી)";
    card.appendChild(answerLabel);
    const answer = document.createElement("select"); answer.className = "ai-answer";
    answer.add(new Option("જવાબ પસંદ કરો","")); ["A","B","C","D"].forEach(letter => answer.add(new Option(letter, letter)));
    answer.value = q.a;
    answer.addEventListener("change", () => q.a = answer.value);
    card.appendChild(answer);

    const trickLabel = document.createElement("label");
    trickLabel.textContent = "વિદ્યાર્થીઓ માટે સરળ ટૂંકી રીત";
    card.appendChild(trickLabel);
    const trick = document.createElement("textarea");
    trick.value = q.shortTrick;
    trick.placeholder = "ધોરણ 8ના બાળકને સમજાય એવી 1થી 3 વાક્યની સરળ રીત";
    trick.addEventListener("input", () => q.shortTrick = trick.value);
    card.appendChild(trick);

    const stepsLabel = document.createElement("label");
    stepsLabel.textContent = "ઉકેલનાં ટૂંકાં પગલાં";
    card.appendChild(stepsLabel);
    const steps = document.createElement("textarea");
    steps.value = q.solutionSteps;
    steps.placeholder = "જવાબ કેવી રીતે મળ્યો તે 2થી 4 ટૂંકાં પગલાંમાં";
    steps.addEventListener("input", () => q.solutionSteps = steps.value);
    card.appendChild(steps);

    host.appendChild(card);
  });
  $("aiApproveActions").style.display = aiDrafts.length ? "flex" : "none";
}

async function saveApprovedAiQuestions(){
  const selected = aiDrafts.filter(q => q.selected);
  if(!selected.length){ setAiStatus("સેવ કરવા માટે ઓછામાં ઓછો એક પ્રશ્ન પસંદ કરો.", true); return; }
  const subject = $("aiSubject").value, topic = $("aiTopic").value, chapter = $("aiChapter").value.trim();
  for(let i=0;i<selected.length;i++){
    const q = selected[i];
    if(!q.q.trim() || q.o.length !== 4 || q.o.some(x => !String(x).trim())){
      setAiStatus(`પ્રશ્ન ${i+1}: પ્રશ્ન અને ચારેય વિકલ્પો તપાસો.`, true); return;
    }
    if(!["A","B","C","D"].includes(q.a)){
      setAiStatus(`પ્રશ્ન ${i+1}: સાચો જવાબ પસંદ કરો.`, true); return;
    }
    if(!String(q.shortTrick || "").trim()){
      setAiStatus(`પ્રશ્ન ${i+1}: વિદ્યાર્થીઓ માટે ટૂંકી રીત લખો અથવા AIની રીત સુધારો.`, true); return;
    }
  }
  const btn = $("saveApprovedBtn"); btn.disabled = true;
  try{
    if(selected.length > 450) throw new Error("એક વખતમાં વધુમાં વધુ 450 પ્રશ્નો સેવ કરી શકાય.");
    const batch = writeBatch(db);
    for(const q of selected){
      const questionRef = doc(collection(db,"questions"));
      batch.set(questionRef, {
        subject, standard:8, topic, chapter,
        question:q.q.trim(), options:q.o.map(x => String(x).trim()),
        correctAnswer:"ABCD".indexOf(q.a), marks:1,
        explanation:String(q.solutionSteps || "").trim(),
        shortTrick:String(q.shortTrick || "").trim(),
        solutionSteps:String(q.solutionSteps || "").trim(),
        aiConfidence:q.confidence, aiAutoApproved:q.autoApproved === true,
        figureSvg:"", hasDiagram:q.has_diagram,
        diagramBox:q.box, questionBox:q.questionBox,
        sourcePhotoIndex:q.photoIndex,
        schoolId: window.currentSchoolId || "school-pansada-anupam",
        createdBy: currentUser.uid, approvedBy: currentUser.uid,
        approvalStatus:"approved",
        source:"ai-photo-review",
        createdAt: serverTimestamp(), updatedAt: serverTimestamp()
      });
    }
    await batch.commit();
    setAiStatus(`${selected.length} મંજૂર પ્રશ્નો પ્રશ્નબેંકમાં સેવ થયા.`);
    aiDrafts = []; $("aiReviewList").innerHTML = "";
    $("aiApproveActions").style.display = "none";
    $("aiImages").value = ""; $("aiCamera").value = "";
    await loadQuestions();
  }catch(error){
    setAiStatus("પ્રશ્નો સેવ થયા નથી. Firestore Rules અથવા નેટવર્ક તપાસો: " + error.message, true);
  }finally{ btn.disabled = false; }
}

$("generateAiBtn").addEventListener("click", generateAiQuestions);
$("clearAiBtn").addEventListener("click", () => {
  $("aiImages").value = ""; $("aiCamera").value = "";
  setAiStatus("ફોટા દૂર કર્યા.");
});
$("saveApprovedBtn").addEventListener("click", saveApprovedAiQuestions);

function previewSvg(){
 const svg = $("figureSvg").value.trim();
 const box = $("figurePreview");
 box.innerHTML = "";
 if(!svg) return;

 if(!/^<svg/i.test(svg) || !/<\/svg>/i.test(svg)){
   box.textContent = "માન્ય SVG કોડ આપો.";
   return;
 }

 const img = document.createElement("img");
 img.alt = "આકૃતિ Preview";
 img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
 box.appendChild(img);
}

$("figureSvg").addEventListener("input", previewSvg);

function resetForm(){
 $("questionForm").reset();
 $("marks").value = 1;
 $("figurePreview").innerHTML = "";
 editingId = null;
 $("formTitle").textContent = "નવો પ્રશ્ન ઉમેરો";
 $("saveBtn").textContent = "પ્રશ્ન સેવ કરો";
}

 return {
   subject: $("subject").value,
   standard: Number($("standard").value),
   topic: $("topic").value,
   chapter: $("chapter").value.trim(),
   question: $("questionText").value.trim(),
   options: [
     $("option0").value.trim(),
     $("option1").value.trim(),
     $("option2").value.trim(),

   ],
   correctAnswer: Number($("correctAnswer").value),
   marks: Number($("marks").value),

   figureSvg: $("figureSvg").value.trim(),

 };
}

function validateQuestion(data){
 if(!data.question || !data.chapter) return "પ્રશ્ન અને પ્રકરણ જરૂરી છે.";
 if(data.options.some(x => !x)) return "ચારેય વિકલ્પો ભરવા જરૂરી છે.";
 if(!Number.isInteger(data.correctAnswer) || data.correctAnswer < 0 || data.correctAnswer > 3)
   return "સાચો જવાબ પસંદ કરો.";
 if(!Number.isInteger(data.marks) || data.marks < 1 || data.marks > 10)
   return "ગુણ 1 થી 10 વચ્ચે હોવા જોઈએ.";
 if(data.figureSvg && (!/^<svg/i.test(data.figureSvg) || !/<\/svg>/i.test(data.figureSvg)))
   return "SVG કોડ યોગ્ય નથી.";
 return "";
}

async function loadQuestions(){
 $("questionList").textContent = "પ્રશ્નો લોડ થઈ રહ્યા છે...";
 try{
   const snap = await getDocs(query(collection(db,"questions"), where("schoolId","==", window.currentSchoolId)));
   allQuestions = [];
   snap.forEach(item => {
     const data = item.data();
     if(data.recordType !== "system"){
       allQuestions.push({id:item.id, ...data});
     }
   });
   renderQuestions();
 }catch(error){
   $("questionList").textContent = "પ્રશ્નો લોડ થયા નથી: " + error.message;
   message("Firestore વાંચવામાં ભૂલ.", true);
 }
}

function renderQuestions(){
 const filter = $("filterSubject").value;
 const search = $("searchText").value.trim().toLowerCase();

 const rows = allQuestions.filter(q => {
   const subjectOK = filter === "ALL" || q.subject === filter;
   const searchOK = !search ||
     String(q.question || "").toLowerCase().includes(search) ||
     String(q.chapter || "").toLowerCase().includes(search);
   return subjectOK && searchOK;
 });

 $("questionList").innerHTML = "";

 if(rows.length === 0){
   $("questionList").textContent = "હાલ કોઈ પ્રશ્ન મળ્યો નથી.";
   return;
 }

 rows.forEach(q => {
   const card = document.createElement("div");
   card.className = "question";

   const heading = document.createElement("b");
   heading.textContent = `${q.subject || ""} | ${q.topic || ""} | ${q.chapter || ""}`;
   card.appendChild(heading);

   const p = document.createElement("p");
   p.textContent = q.question || "";
   card.appendChild(p);

   const options = document.createElement("div");
   options.className = "options";
   (q.options || []).forEach((option, i) => {
     const item = document.createElement("div");
     item.className = "option";
     item.textContent = `${"ABCD"[i]}. ${option}`;
     options.appendChild(item);
   });
   card.appendChild(options);

   const answer = document.createElement("small");
   answer.textContent = `સાચો જવાબ: ${"ABCD"[q.correctAnswer] || "-"} | ગુણ: ${q.marks || 1}`;
   card.appendChild(answer);

   if(q.shortTrick){
     const trick = document.createElement("p");
     trick.textContent = "ટૂંકી રીત: " + q.shortTrick;
     card.appendChild(trick);
   }
   if(q.solutionSteps || q.explanation){
     const exp = document.createElement("p");
     exp.textContent = "ઉકેલ: " + (q.solutionSteps || q.explanation);
     card.appendChild(exp);
   }
   if(Number.isFinite(Number(q.aiConfidence))){
     const confidence = document.createElement("small");
     confidence.textContent = `AI વિશ્વાસ સ્કોર: ${q.aiConfidence}%`;
     card.appendChild(confidence);
   }

   const actions = document.createElement("div");
   actions.className = "actions";

   const edit = document.createElement("button");
   edit.className = "green";
   edit.textContent = "સુધારો";
   edit.addEventListener("click", () => editQuestion(q.id));

   const remove = document.createElement("button");
   remove.className = "red";
   remove.textContent = "ડિલીટ";
   remove.addEventListener("click", () => removeQuestion(q.id));

   actions.append(edit, remove);
   card.appendChild(actions);
   $("questionList").appendChild(card);
 });
}

async function editQuestion(id){
 const q = allQuestions.find(item => item.id === id);
 if(!q) return;

 editingId = id;
 $("subject").value = q.subject || "MAT";
 $("standard").value = String(q.standard || 8);
 $("topic").value = q.topic || "અન્ય";
 $("chapter").value = q.chapter || "";
 $("questionText").value = q.question || "";
 (q.options || ["","","",""]).forEach((v, i) => {
   $("option"+i).value = v;
 });
 $("correctAnswer").value = String(q.correctAnswer ?? 0);
 $("marks").value = q.marks || 1;
 $("explanation").value = q.explanation || "";
 $("figureSvg").value = q.figureSvg || "";
 previewSvg();

 $("formTitle").textContent = "પ્રશ્નમાં સુધારો";
 $("saveBtn").textContent = "સુધારો સેવ કરો";
 window.scrollTo({top:0, behavior:"smooth"});
}

async function removeQuestion(id){
 if(!confirm("શું આ પ્રશ્ન ડિલીટ કરવો છે?")) return;
 try{
   await deleteDoc(doc(db,"questions",id));
   message("પ્રશ્ન ડિલીટ થયો.");
   await loadQuestions();
 }catch(error){
   message("ડિલીટ કરવામાં ભૂલ: " + error.message, true);
 }
}

$("questionForm").addEventListener("submit", async event => {
 event.preventDefault();
 if(!currentUser) return;

 const data = getFormData();
 const problem = validateQuestion(data);
 if(problem){ message(problem, true); return; }

 $("saveBtn").disabled = true;
 try{
   if(editingId){
     await updateDoc(doc(db,"questions",editingId), data);
     message("પ્રશ્નમાં સુધારો સેવ થયો.");
   }else{
     data.createdBy = currentUser.uid;
     data.schoolId = window.currentSchoolId || "school-pansada-anupam";
     data.approvalStatus = "approved";
     data.approvedBy = currentUser.uid;
     data.createdAt = serverTimestamp();
     await addDoc(collection(db,"questions"), data);
     message("નવો પ્રશ્ન સફળતાપૂર્વક સેવ થયો.");
   }
   resetForm();
   await loadQuestions();
 }catch(error){
   message("સેવ કરવામાં ભૂલ: " + error.message, true);
 }finally{
   $("saveBtn").disabled = false;
 }
});

$("clearBtn").addEventListener("click", resetForm);
$("filterSubject").addEventListener("change", renderQuestions);
$("searchText").addEventListener("input", renderQuestions);

$("logoutBtn").addEventListener("click", async () => {
 try{
   await signOut(auth);
   window.location.replace("./index.html");
 }catch(error){
   message("Logout ભૂલ: " + error.message, true);
 }
});

onAuthStateChanged(auth, async user => {
 if(!user){
   window.location.replace("./index.html");
   return;
 }

 currentUser = user;

 try{
   const teacherSnap = await getDoc(doc(db,"teachers",user.uid));
   if(!teacherSnap.exists()){
     await signOut(auth);
     window.location.replace("./index.html");
     return;
   }

   const teacher = teacherSnap.data();
   window.currentSchoolId = teacher.schoolId || "";
   if(teacher.active !== true || teacher.role !== "admin"){
     await signOut(auth);
     alert("Admin પરવાનગી જરૂરી છે.");
     window.location.replace("./index.html");
     return;
   }

   $("teacherName").textContent = teacher.name || "શિક્ષક";
   $("schoolName").textContent = teacher.schoolId || "-";

   if(teacher.schoolId){
     const schoolSnap = await getDoc(doc(db,"schools",teacher.schoolId));
     if(schoolSnap.exists()){
       $("schoolName").textContent = schoolSnap.data().name || teacher.schoolId;
     }
   }

   $("loginMessage").classList.add("hidden");
   $("app").classList.remove("hidden");

   await loadQuestions();

 }catch(error){
   $("loginMessage").textContent = "Firebase ચકાસણીમાં ભૂલ: " + error.message;
 }
});
</script>
