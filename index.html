<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NMMS AI ગેમ જનરેટર</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Segoe UI', sans-serif; min-height: 100vh; background: #1a1a2e; display: flex; justify-content: center; padding: 15px 0; }
.card { max-width: 680px; width: 96%; padding: 22px; border-radius: 25px; border: 3px solid #fff; background: linear-gradient(120deg, #ff9a9e, #fad0c4, #a18cd1, #fbc2eb); background-size: 400% 400%; animation: flow 15s ease infinite; }
@keyframes flow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
.hidden { display: none !important; }
h1 { color: #4a148c; font-size: 19px; text-align: center; margin: 0 0 12px; }
button { width: 100%; padding: 14px; margin: 6px 0; border-radius: 14px; border: none; font-size: 15px; font-weight: bold; cursor: pointer; color: #fff; transition: .2s; font-family: inherit; }
button:disabled { opacity: .5; }
.btn-orange { background: #ff9800; }
.btn-purple { background: #673ab7; }
.btn-green { background: #4caf50; }
.btn-red { background: #d32f2f; }
.photoBox { background: white; border: 3px dashed #673ab7; border-radius: 15px; padding: 15px; text-align: center; margin: 10px 0; }
.preview-grid { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0; }
.preview-item { position: relative; flex: 0 0 70px; }
.preview-item img { height: 70px; width: 70px; border-radius: 8px; border: 2px solid #673ab7; object-fit: cover; }
.preview-item .remove { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; background: #d32f2f; color: white; border: none; cursor: pointer; }
.option { padding: 15px; margin: 8px 0; border-radius: 14px; background: #fff; cursor: pointer; border: 3px solid #e0e0e0; font-size: 16px; width: 100%; text-align: left; color: #333; font-weight: bold;}
.option.right { background: #2ecc71 !important; color: #fff !important; }
.option.wrong { background: #e74c3c !important; color: #fff !important; }
#quizImage { max-width: 100%; max-height: 240px; border-radius: 12px; display: none; margin: 0 auto 10px; border: 2px solid #673ab7; background: #fff; }
.loader { display: inline-block; width: 14px; height: 14px; border: 3px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
.top { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 12px; color: #4a148c; }
#timer { background: #4a148c; color: #fff; padding: 6px 12px; border-radius: 20px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 14px 24px; border-radius: 12px; color: #fff; font-weight: bold; background: #333; z-index: 1000; }
#shareLink { width: 100%; padding: 14px; border-radius: 12px; border: 2px solid #673ab7; font-size: 12px; margin-bottom: 8px; }
.scoreCard { background: #fff; padding: 25px; border-radius: 20px; text-align: center; }
</style>
</head>
<body>

<div class="card" id="teacherPanel">
  <h1>📚 NMMS AI ગેમ જનરેટર</h1>
  
  <div class="photoBox">
    <p style="font-weight:bold;color:#673ab7;">📷 ફોટા પસંદ કરો (૧ થી ૮)</p>
    <!-- આ વખતે ફોટા પસંદ કરવાનું બટન સીધું જ દેખાશે -->
    <input type="file" id="photoInput" accept="image/*" multiple style="width:100%; padding:12px; border-radius:10px; border:2px solid #ff9800; background:#fff; margin-bottom:10px;">
    <div id="photoPreview" class="preview-grid"></div>
    <p id="photoStatus" style="font-size:13px; font-weight:bold; color:#d32f2f;"></p>
  </div>

  <button id="genBtn" class="btn-purple" disabled>🚀 AI પાસે પ્રશ્નો બનાવો</button>
  <p id="status" style="text-align:center;font-size:13px;font-weight:bold;"></p>

  <div id="reviewBox" class="hidden" style="margin-top:15px;background:#e8f5e9;padding:10px;border-radius:10px;">
    <p style="font-weight:bold;color:#2e7d32;">🔍 AI એ ઓળખેલા પ્રશ્નો:</p>
    <div id="reviewContent" style="max-height:250px;overflow-y:auto;"></div>
    <button class="btn-green" id="approveBtn" style="margin-top:10px;">➕ બધા મંજૂર કરો</button>
  </div>

  <div id="finalBox" class="hidden" style="margin-top:15px;">
    <button class="btn-red" id="publishBtn">🎮 ગેમ બનાવો (લિંક બનાવો)</button>
  </div>

  <div id="linkBox" class="hidden" style="margin-top:15px; background:#fff; padding:15px; border-radius:12px;">
    <p style="color:#2e7d32; font-weight:bold;">✅ ગેમ તૈયાર છે! લિંક કોપી કરો:</p>
    <input type="text" id="shareLink" readonly>
    <button class="btn-green" id="copyBtn">📋 લિંક કોપી કરો</button>
  </div>
</div>

<div class="card hidden" id="studentPanel">
  <div id="nameScreen" style="text-align:center; padding:20px;">
    <h1>તમારું નામ શું છે?</h1>
    <input type="text" id="studentName" style="width:100%; padding:14px; border-radius:10px; border:2px solid #673ab7; margin:10px 0; text-align:center; font-size:16px;">
    <button class="btn-green" id="startQuizBtn">▶️ રમવાનું શરૂ કરો</button>
  </div>

  <div id="quizScreen" class="hidden">
    <div class="top"><div id="progress"></div><div id="timer"></div></div>
    <h3 id="q"></h3>
    <img id="quizImage">
    <div id="opts"></div>
  </div>

  <div id="resultBox" class="hidden scoreCard">
    <h2 id="resultName"></h2>
    <h1 id="finalScore" style="color:#2ecc71; font-size:50px; margin:10px 0;"></h1>
    <button class="btn-purple" onclick="location.reload()">🔄 ફરી રમો</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, collection } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// અહીં તમારી ImgBB કી પેસ્ટ કરો
const IMGBB_API_KEY = "તમારી_કી_અહીં_પેસ્ટ_કરો"; 

const firebaseConfig = {
  apiKey: "AIzaSyAfrlNECiB_hi60qmelL2b0EvNRNT-7RM4",
  authDomain: "nmms-quiz-262e5.firebaseapp.com",
  projectId: "nmms-quiz-262e5",
  storageBucket: "nmms-quiz-262e5.firebasestorage.app",
  messagingSenderId: "449195687287",
  appId: "1:449195687287:web:65c1a2ea249ab5a0887572"
};

const AI_ENDPOINT = "https://nmms-ai-backend.jarinarajpura1979.workers.dev";
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let selectedPhotos = [];
let tempQuestions = [];
let masterQuestions = [];
let quiz = [];
let current = 0, score = 0;
let timerId = null, timeLeft = 0;
const $ = id => document.getElementById(id);

function showToast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 3000);
}

// ફોટા પસંદ કરવાનું લોજિક
$("photoInput").addEventListener("change", async (e) => {
  const files = Array.from(e.target.files);
  if(files.length === 0) return;
  if(files.length > 8) return showToast("વધુમાં વધુ 8 ફોટા પસંદ કરો.");
  
  selectedPhotos = [];
  $("photoPreview").innerHTML = "";
  $("photoStatus").textContent = "ફોટા પ્રોસેસ થઈ રહ્યા છે...";

  for(let file of files) {
    const dataUrl = await compressImage(file);
    if(dataUrl) {
      selectedPhotos.push({ dataUrl });
      const img = document.createElement("img");
      img.src = dataUrl; img.style.width="60px"; img.style.height="60px"; img.style.margin="5px"; img.style.borderRadius="5px";
      $("photoPreview").appendChild(img);
    }
  }
  $("photoStatus").textContent = `✅ ${selectedPhotos.length} ફોટા તૈયાર.`;
  $("genBtn").disabled = false;
});

async function compressImage(file) {
  const bitmap = await createImageBitmap(file);
  const canvas = document.createElement("canvas");
  const scale = Math.min(1, 1200 / Math.max(bitmap.width, bitmap.height));
  canvas.width = bitmap.width * scale; canvas.height = bitmap.height * scale;
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL("image/jpeg", 0.8);
}

// AI ને કોલ કરવો
$("genBtn").addEventListener("click", async () => {
  if(selectedPhotos.length === 0) return showToast("ફોટા પસંદ કરો.");
  $("genBtn").innerHTML = '<span class="loader"></span> AI વાંચી રહ્યું છે...';
  $("genBtn").disabled = true;
  $("status").textContent = "AI ફોટા વાંચી રહ્યું છે...";

  try {
    const res = await fetch(AI_ENDPOINT, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ images: selectedPhotos.map(p => ({ mimeType: "image/jpeg", data: p.dataUrl.split(",")[1] })) })
    });
    const data = await res.json();
    
    if(!res.ok || !data.questions) throw new Error(data.error || "AI ભૂલ");
    
    tempQuestions = data.questions.map(q => ({ ...q, _id: Math.random() }));
    renderReview();
    $("reviewBox").classList.remove("hidden");
    $("status").textContent = `AI એ ${tempQuestions.length} પ્રશ્નો આપ્યા.`;
  } catch(err) {
    showToast(err.message);
    $("status").textContent = "❌ નિષ્ફળ.";
  } finally {
    $("genBtn").textContent = "🚀 AI પાસે પ્રશ્નો બનાવો";
    $("genBtn").disabled = false;
  }
});

function renderReview() {
  $("reviewContent").innerHTML = "";
  tempQuestions.forEach((q, i) => {
    const div = document.createElement("div");
    div.style.background = "#fff"; div.style.padding = "10px"; div.style.marginBottom="5px"; div.style.borderRadius="5px";
    div.innerHTML = `<b>Q${i+1}:</b> ${q.q} <br><i style="color:green">Answer: ${q.a}</i>`;
    $("reviewContent").appendChild(div);
  });
}

$("approveBtn").addEventListener("click", () => {
  masterQuestions.push(...tempQuestions);
  $("reviewBox").classList.add("hidden");
  $("finalBox").classList.remove("hidden");
  showToast("પ્રશ્નો ઉમેરાયા!");
});

// ગેમ સેવ કરવી (ImgBB સાથે)
$("publishBtn").addEventListener("click", async () => {
  if(IMGBB_API_KEY === "તમારી_કી_અહીં_પેસ્ટ_કરો") return showToast("કોડમાં ImgBB કી પેસ્ટ કરો.");
  $("publishBtn").textContent = "સેવ થઈ રહી છે...";
  $("publishBtn").disabled = true;

  try {
    const gameRef = doc(collection(db, "games"));
    const gameId = gameRef.id;

    const finalQs = await Promise.all(masterQuestions.map(async (q) => {
      if(!q.has_diagram || !q.box) return q;
      // જો ઇમેજ હોય તો ક્રોપ કરીને ImgBB પર મોકલો
      const croppedImg = await cropImage(selectedPhotos[q.photoIndex || 0].dataUrl, q.box);
      if(!croppedImg) return q;
      
      const formData = new FormData();
      formData.append("image", croppedImg.split(",")[1]);
      const imgRes = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
      const imgData = await imgRes.json();
      return { ...q, img: imgData.data.url };
    }));

    await setDoc(gameRef, { questions: finalQs });
    
    const link = window.location.origin + window.location.pathname + "?game=" + gameId;
    $("shareLink").value = link;
    $("linkBox").classList.remove("hidden");
    $("finalBox").classList.add("hidden");
  } catch(err) {
    showToast("એરર: " + err.message);
  } finally {
    $("publishBtn").textContent = "🎮 ગેમ બનાવો (લિંક બનાવો)";
    $("publishBtn").disabled = false;
  }
});

function cropImage(dataUrl, box) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const [ymin, xmin, ymax, xmax] = box;
      const canvas = document.createElement("canvas");
      canvas.width = (xmax - xmin) / 1000 * img.width;
      canvas.height = (ymax - ymin) / 1000 * img.height;
      canvas.getContext("2d").drawImage(img, (xmin/1000)*img.width, (ymin/1000)*img.height, canvas.width, canvas.height, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL("image/jpeg"));
    };
    img.src = dataUrl;
  });
}

$("copyBtn").onclick = () => { navigator.clipboard.writeText($("shareLink").value); showToast("કોપી થયું!"); };

// વિદ્યાર્થી લોજિક
async function init() {
  const id = new URLSearchParams(window.location.search).get("game");
  if(!id) return;
  $("teacherPanel").classList.add("hidden");
  $("studentPanel").classList.remove("hidden");
  
  const docSnap = await getDoc(doc(db, "games", id));
  if(docSnap.exists()) quiz = docSnap.data().questions;
}

$("startQuizBtn").onclick = () => {
  $("nameScreen").classList.add("hidden");
  $("quizScreen").classList.remove("hidden");
  showQ();
};

function showQ() {
  if(current >= quiz.length) {
    $("quizScreen").classList.add("hidden");
    $("resultBox").classList.remove("hidden");
    $("finalScore").textContent = `${score}/${quiz.length}`;
    return;
  }
  $("progress").textContent = `પ્રશ્ન ${current+1}/${quiz.length}`;
  $("q").textContent = quiz[current].q;
  $("opts").innerHTML = "";
  
  if(quiz[current].img) { $("quizImage").src = quiz[current].img; $("quizImage").style.display = "block"; }
  else $("quizImage").style.display = "none";

  quiz[current].o.forEach((opt, i) => {
    const b = document.createElement("button");
    b.className = "option"; b.textContent = opt;
    b.onclick = () => {
      if(opt === quiz[current].a) score++;
      current++; showQ();
    };
    $("opts").appendChild(b);
  });
}

init();
</script>
</body>
</html>
